<html lang="zh-CN" data-trae-theme="dark"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>太阳系倒计时</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; background: #04060f; font-family: -apple-system, "PingFang SC", sans-serif; }
.page { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }

/* 设计空间 750x1000，整体缩放适配屏幕 */
.stage { position: relative; width: 750px; height: 1000px; transform-origin: center center; flex: none; }

/* 星空 */
.star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle 3s ease-in-out infinite; }
@keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }

/* 轨道层 */
svg.orbits { position: absolute; inset: 0; width: 750px; height: 1000px; }
.orbit-base { fill: none; stroke: rgba(255,255,255,.05); stroke-width: 1.2; }
.orbit-trail { fill: none; stroke: rgba(255,208,125,.55); stroke-width: 2.5; stroke-linecap: round; filter: drop-shadow(0 0 3px rgba(255,180,80,.6)); }

/* 太阳 */
.sun { position: absolute; left: 375px; top: 482px; transform: translate(-50%,-50%); cursor: pointer; z-index: 20; text-align: center; }
.sun-body { width: 120px; height: 120px; border-radius: 50%; margin: 0 auto;
  background: radial-gradient(circle at 40% 38%, #fff8e0, #ffd76a 35%, #ff9a2e 70%, #e05a00);
  box-shadow: 0 0 40px 12px rgba(255,170,60,.55), 0 0 110px 40px rgba(255,120,20,.25);
  display: flex; align-items: center; justify-content: center;
  transition: filter .3s, box-shadow .3s; }
.sun.idle .sun-body { filter: brightness(.55) saturate(.7); box-shadow: 0 0 18px 5px rgba(255,170,60,.25); }
.sun.running .sun-body { animation: sunPulse 2.4s ease-in-out infinite; }
@keyframes sunPulse { 0%,100% { box-shadow: 0 0 40px 12px rgba(255,170,60,.55), 0 0 110px 40px rgba(255,120,20,.25); } 50% { box-shadow: 0 0 55px 18px rgba(255,190,80,.7), 0 0 140px 55px rgba(255,130,25,.35); } }
.sun-time { font-size: 22px; font-weight: 700; color: #7a2e00; text-shadow: 0 0 6px rgba(255,255,220,.9); font-variant-numeric: tabular-nums; }
.sun.idle .sun-time { color: rgba(122,46,0,.55); }
.sun-hint { margin-top: 8px; font-size: 13px; color: rgba(255,220,170,.5); }

/* 行星 */
.planet-wrap { position: absolute; width: 64px; height: 64px; transform: translate(-50%,-50%); cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
.planet { border-radius: 50%; transition: filter .3s, opacity .3s; position: relative; }
.planet.paused { opacity: .5; filter: saturate(.5); }
.p-mercury { background: radial-gradient(circle at 35% 35%, #c9c9c9, #8a8a8a 60%, #555); }
.p-venus   { background: radial-gradient(circle at 35% 35%, #ffe9b8, #e8c07a 55%, #a8763a); }
.p-earth   { background: radial-gradient(circle at 35% 35%, #bfe3ff, #6fb7ff 45%, #2a5fa8 80%); }
.p-mars    { background: radial-gradient(circle at 35% 35%, #ffb98a, #e07b4c 55%, #8a3a1a); }
.p-jupiter { background: radial-gradient(circle at 35% 35%, #ffedd0, #e8c8a0 45%, #a8763a 85%); }
.p-saturn  { background: radial-gradient(circle at 35% 35%, #fff3cf, #e8d8a8 50%, #a8894a); }
.p-uranus  { background: radial-gradient(circle at 35% 35%, #d8fbff, #8adfe8 50%, #3a98a8); }
.p-neptune { background: radial-gradient(circle at 35% 35%, #b8ccff, #5a78e0 50%, #26389a); }
.saturn-ring { position: absolute; width: 110px; height: 34px; border: 5px solid rgba(232,216,168,.75); border-radius: 50%; transform: rotate(-18deg); pointer-events: none; }

/* 爆炸 + 燃烧 */
.planet.burning { background: radial-gradient(circle at 40% 40%, #fff6d8, #ffb347 30%, #ff6a00 60%, #b3220e 85%, #6b1408) !important;
  animation: burnFlicker .9s ease-in-out infinite; opacity: 1; filter: none; }
@keyframes burnFlicker {
  0%,100% { transform: scale(1.25); box-shadow: 0 0 26px 8px rgba(255,130,40,.85), 0 0 70px 22px rgba(255,80,0,.4); }
  50% { transform: scale(1.55); box-shadow: 0 0 44px 14px rgba(255,160,60,1), 0 0 100px 32px rgba(255,100,0,.55); } }
.planet.burning::after { content:''; position: absolute; inset: -34px; border-radius: 50%; border: 3px solid rgba(255,150,60,.8); animation: burnWave 1.4s ease-out infinite; }
@keyframes burnWave { 0% { opacity:.9; transform: scale(.55);} 100% { opacity:0; transform: scale(1.8);} }

.boom { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; z-index: 15; }
.boom-flash { position: absolute; left: -170px; top: -170px; width: 340px; height: 340px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,240,.95), rgba(255,200,90,.5) 40%, transparent 70%);
  animation: boomFlash .9s ease-out forwards; }
@keyframes boomFlash { 0% {opacity:1; transform: scale(.3);} 60% {opacity:.85;} 100% {opacity:0; transform: scale(2);} }
.boom-ring { position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; border-radius: 50%; border: 4px solid rgba(255,170,80,.85); animation: boomRing 1.2s ease-out forwards; }
.boom-ring.r2 { animation-delay: .22s; }
@keyframes boomRing { 0% {opacity:.95; transform: scale(.4);} 100% {opacity:0; transform: scale(6);} }
.spark { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.spark i { position: absolute; left: -5px; top: -5px; width: 10px; height: 10px; border-radius: 50%; background: #ffcc66; box-shadow: 0 0 10px rgba(255,160,60,.95); animation: sparkFly 1.1s ease-out forwards; }
@keyframes sparkFly { 0% {opacity:1; transform: translateY(0) scale(1);} 70% {opacity:.9;} 100% {opacity:0; transform: translateY(-230px) scale(.35);} }

/* 音效开关 */
.sound-btn { position: absolute; top: 18px; right: 18px; z-index: 30; width: 46px; height: 46px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 20px; color: #ffd76a; user-select: none; }
.sound-btn img { width: 26px; height: 26px; display: block; }
.sound-btn.off img { opacity: .35; }
.sound-btn.off::after { content: ''; position: absolute; width: 34px; height: 2px; border-radius: 1px; background: rgba(255,255,255,.65); transform: rotate(-45deg); }

/* 底部面板 */
.panel { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 25; width: 700px;
  background: rgba(10,16,34,.72); border: 1px solid rgba(255,255,255,.08); border-radius: 18px; padding: 12px 16px;
  backdrop-filter: blur(8px); }
.panel-hint { text-align: center; font-size: 12px; color: rgba(255,255,255,.35); margin-bottom: 8px; }
.rows { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.row { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 12px;
  background: rgba(255,255,255,.05); cursor: pointer; transition: background .2s; }
.row:hover { background: rgba(255,255,255,.1); }
.row .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.2); }
.row.running .dot { background: #ffd76a; box-shadow: 0 0 6px #ffd76a; }
.row.paused .dot { background: #7ab8ff; }
.row.done { background: rgba(255,110,40,.18); box-shadow: 0 0 0 1px rgba(255,120,50,.4); }
.row.done .dot { background: #ff8a3c; box-shadow: 0 0 6px #ff8a3c; }
.row .name { font-size: 14px; color: rgba(255,255,255,.85); }
.row .time { font-size: 14px; color: rgba(255,220,170,.85); font-variant-numeric: tabular-nums; }
.row.done .time { color: #ff9a5c; }
</style>

<script>
const CX = 375, CY = 482, TAU = Math.PI * 2;
const PLANETS = [
  { key:'mercury', name:'水星', dur:60,    size:16, rx:108, hue:'small'  },
  { key:'venus',   name:'金星', dur:180,   size:24, rx:150, hue:'small'  },
  { key:'earth',   name:'地球', dur:300,   size:26, rx:190, hue:'mid'    },
  { key:'mars',    name:'火星', dur:600,   size:20, rx:230, hue:'small'  },
  { key:'jupiter', name:'木星', dur:3000,  size:48, rx:270, hue:'giant'  },
  { key:'saturn',  name:'土星', dur:7200,  size:42, rx:305, hue:'giant', ring:true },
  { key:'uranus',  name:'天王星',dur:21600, size:32, rx:335, hue:'mid'   },
  { key:'neptune', name:'海王星',dur:36000, size:30, rx:365, hue:'giant'  },
];
PLANETS.forEach((p, i) => {
  p.ry = p.rx * 1.30;
  p.angle = i * 0.8;           // 初始散布角度
  p.anchor = p.angle;          // 本轮公转起点
  p.state = 'ready';           // ready | running | paused | done
  p.runStart = 0;
});

const stage = document.getElementById('stage');
const svg = document.getElementById('orbitsSvg');
const NS = 'http://www.w3.org/2000/svg';

// ---- 星空 ----
for (let i = 0; i < 90; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const sz = Math.random() * 2.2 + 0.8;
  s.style.cssText = `left:${Math.random()*750}px;top:${Math.random()*1000}px;width:${sz}px;height:${sz}px;animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
  stage.insertBefore(s, svg);
}

// ---- 轨道 + 行星 DOM ----
PLANETS.forEach((p, i) => {
  const base = document.createElementNS(NS, 'ellipse');
  base.setAttribute('cx', CX); base.setAttribute('cy', CY);
  base.setAttribute('rx', p.rx); base.setAttribute('ry', p.ry);
  base.setAttribute('class', 'orbit-base');
  svg.appendChild(base);

  const trail = document.createElementNS(NS, 'path');
  trail.setAttribute('class', 'orbit-trail');
  trail.setAttribute('d', '');
  svg.appendChild(trail);
  p.trailEl = trail;

  const wrap = document.createElement('div');
  wrap.className = 'planet-wrap';
  wrap.innerHTML = `<div class="planet p-${p.key}" style="width:${p.size}px;height:${p.size}px"></div>` +
    (p.ring ? '<div class="saturn-ring"></div>' : '');
  wrap.addEventListener('click', () => onPlanetTap(i));
  stage.appendChild(wrap);
  p.wrapEl = wrap;
  p.planetEl = wrap.querySelector('.planet');
  p.ringEl = wrap.querySelector('.saturn-ring');
  placePlanet(p, p.angle);
});

// ---- 底部面板 ----
const rowsEl = document.getElementById('rows');
PLANETS.forEach((p, i) => {
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<span class="dot"></span><span class="name">${p.name}</span><span class="time">${fmt(p.dur)}</span>`;
  row.addEventListener('click', () => onPlanetTap(i));
  rowsEl.appendChild(row);
  p.rowEl = row;
  p.timeEl = row.querySelector('.time');
});

function fmt(sec) {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), s = sec%60;
  const pad = n => String(n).padStart(2,'0');
  return h > 0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function placePlanet(p, a) {
  p.wrapEl.style.left = (CX + p.rx * Math.cos(a)) + 'px';
  p.wrapEl.style.top  = (CY + p.ry * Math.sin(a)) + 'px';
}
// 走过的轨迹：从 anchor 到 angle 的椭圆弧（折线采样，精确贴轨）
function drawTrail(p, fromA, toA) {
  const span = toA - fromA;
  if (span <= 0.002) { p.trailEl.setAttribute('d', ''); return; }
  const n = Math.max(2, Math.ceil(span / TAU * 140));
  let d = '';
  for (let k = 0; k <= n; k++) {
    const a = fromA + span * k / n;
    d += (k === 0 ? 'M' : 'L') + (CX + p.rx*Math.cos(a)).toFixed(1) + ' ' + (CY + p.ry*Math.sin(a)).toFixed(1);
  }
  p.trailEl.setAttribute('d', d);
}

// ---- 交互：行星三态循环 + done 重置 ----
function onPlanetTap(i) {
  const p = PLANETS[i];
  if (p.state === 'ready') {
    p.state = 'running';
    p.runStart = performance.now();
  } else if (p.state === 'running') {
    p.state = 'paused';
    p.remain = p.dur - (performance.now() - p.runStart) / 1000;
  } else if (p.state === 'paused') {
    // 重置：时间恢复满额，以停止位置为新起点
    p.anchor = p.angle % TAU;
    p.state = 'ready';
    p.trailEl.setAttribute('d', '');
    p.timeEl.textContent = fmt(p.dur);
  } else if (p.state === 'done') {
    stopBurnSound(i);
    p.state = 'ready';
    p.anchor = p.angle % TAU;
    p.trailEl.setAttribute('d', '');
    p.planetEl.classList.remove('burning');
    if (p.ringEl) p.ringEl.style.display = '';
    p.timeEl.textContent = fmt(p.dur);
  }
  syncRow(p);
}
function syncRow(p) { p.rowEl.className = 'row ' + (p.state === 'ready' ? '' : p.state); }

function explode(i) {
  const p = PLANETS[i];
  p.state = 'done';
  p.timeEl.textContent = '燃烧中';
  p.planetEl.classList.add('burning');
  if (p.ringEl) p.ringEl.style.display = 'none';
  drawTrail(p, p.anchor, p.anchor + TAU); // 整圈金色
  navigator.vibrate && navigator.vibrate(200);
  playExplosion(i);
  startBurnSound(i);
  // 爆炸覆盖层（一次性动画，播完即移除）
  const boom = document.createElement('div');
  boom.className = 'boom';
  boom.innerHTML = `<div class="boom-flash"></div><div class="boom-ring"></div><div class="boom-ring r2"></div>` +
    [0,45,90,135,180,225,270,315].map(dg => `<div class="spark" style="transform:rotate(${dg}deg)"><i></i></div>`).join('');
  p.wrapEl.appendChild(boom);
  setTimeout(() => boom.remove(), 1400);
  syncRow(p);
}

// ---- 太阳：正计时三态 ----
const sunEl = document.getElementById('sun'), sunTimeEl = document.getElementById('sunTime'), sunHintEl = document.getElementById('sunHint');
let sun = { state: 'idle', elapsed: 0, start: 0 };
sunEl.addEventListener('click', () => {
  if (sun.state === 'idle') { sun.state = 'running'; sun.start = performance.now(); sunHintEl.textContent = '点击暂停'; }
  else if (sun.state === 'running') { sun.state = 'paused'; sun.elapsed += performance.now() - sun.start; sunHintEl.textContent = '点击清零'; }
  else { sun.state = 'idle'; sun.elapsed = 0; sunTimeEl.textContent = '00:00'; sunHintEl.textContent = '点击开始'; }
  sunEl.className = 'sun ' + sun.state;
});

// ---- 主循环 ----
setInterval(() => {
  const now = performance.now();
  if (sun.state === 'running') sunTimeEl.textContent = fmt((sun.elapsed + now - sun.start) / 1000);
  PLANETS.forEach((p, i) => {
    if (p.state !== 'running') return;
    const el = (now - p.runStart) / 1000;
    const prog = el / p.dur;
    if (prog >= 1) { p.angle = p.anchor + TAU; placePlanet(p, p.angle); explode(i); return; }
    p.angle = p.anchor + prog * TAU;
    placePlanet(p, p.angle);
    drawTrail(p, p.anchor, p.angle);
    p.timeEl.textContent = fmt(p.dur - el);
  });
}, 50);

// ---- 音效：WebAudio 实时合成（无需音频文件）----
let actx = null, soundOn = true;
const burnNodes = {};
function ac() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); return actx; }
// 每颗行星音色参数：小行星清脆短促，巨行星深沉绵长
const TONE = {
  small: { dur:.9,  decay:5.0, lp:3200, crack:26, vol:.8,  pops:16, bedLp:900,  burnDur:2.6 },
  mid:   { dur:1.4, decay:3.2, lp:1800, crack:20, vol:.85, pops:12, bedLp:600,  burnDur:3.0 },
  giant: { dur:2.0, decay:2.2, lp:900,  crack:14, vol:.95, pops:7,  bedLp:350,  burnDur:3.4 },
};
function makeNoiseBuf(ctx, seconds) {
  const buf = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * seconds), ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}
function playExplosion(i) {
  if (!soundOn) return;
  const ctx = ac(), t = TONE[PLANETS[i].hue];
  const src = ctx.createBufferSource(); src.buffer = makeNoiseBuf(ctx, t.dur);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = t.lp;
  const g = ctx.createGain();
  const now = ctx.currentTime;
  g.gain.setValueAtTime(t.vol, now);
  g.gain.exponentialRampToValueAtTime(0.001, now + t.dur);
  // 初始高频爆裂
  const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
  const g2 = ctx.createGain();
  g2.gain.setValueAtTime(t.vol * .9, now);
  g2.gain.exponentialRampToValueAtTime(0.001, now + t.dur * 60 / t.crack / 10);
  src.connect(lp).connect(g).connect(ctx.destination);
  src.connect(hp).connect(g2).connect(ctx.destination);
  src.start(); src.stop(now + t.dur);
}
function startBurnSound(i) {
  if (!soundOn || burnNodes[i]) return;
  const ctx = ac(), t = TONE[PLANETS[i].hue];
  const src = ctx.createBufferSource(); src.buffer = makeNoiseBuf(ctx, t.burnDur); src.loop = true;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = t.bedLp;
  const g = ctx.createGain(); g.gain.value = 0.05;
  src.connect(lp).connect(g).connect(ctx.destination);
  src.start();
  // 噼啪：随机短促脉冲
  const popTimer = setInterval(() => {
    if (!soundOn) return;
    const o = ctx.createBufferSource(); o.buffer = makeNoiseBuf(ctx, 0.05);
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 800 + Math.random() * 2400;
    const gg = ctx.createGain(); const n = ctx.currentTime;
    gg.gain.setValueAtTime(0.12 + Math.random() * 0.18, n);
    gg.gain.exponentialRampToValueAtTime(0.001, n + 0.05 + Math.random() * 0.05);
    o.connect(f).connect(gg).connect(ctx.destination);
    o.start(); o.stop(n + 0.12);
  }, 1000 / t.pops);
  burnNodes[i] = { src, popTimer };
}
function stopBurnSound(i) {
  const b = burnNodes[i];
  if (b) { try { b.src.stop(); } catch(e){} clearInterval(b.popTimer); delete burnNodes[i]; }
}
document.getElementById('soundBtn').addEventListener('click', function(e) {
  e.stopPropagation();
  soundOn = !soundOn;
  this.classList.toggle('off', !soundOn);
  if (!soundOn) Object.keys(burnNodes).forEach(stopBurnSound);
  else PLANETS.forEach((p, i) => { if (p.state === 'done') startBurnSound(i); });
});

// ---- 舞台缩放适配 ----
function fit() {
  const s = Math.min(innerWidth / 750, innerHeight / 1000);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();
</script>
